[mypy]
# AGENTS.md §5 / §15：strict + 禁 Any
strict = True
disallow_any_explicit = True
warn_redundant_casts = True
# 服务分别独立运行（避免 "app" 模块冲突）；单服务 CI 单独 mypy
files = packages
python_version = 3.11
# 第三方 SDK 没类型 stub 时显式标注，不静默忽略
ignore_missing_imports = False
warn_unused_configs = True
warn_unused_ignores = True
