[project]
name = "elder-agent-workspace"
version = "0.0.1"
description = "老友（Android）服务端 monorepo —— MVP 基建"
requires-python = ">=3.11"
readme = "README.md"

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv]
dev-dependencies = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "coverage[toml]>=7.6.0",
    "types-python-dateutil>=2.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "services"]
markers = [
    "external: requires local docker compose mock infra",
]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["packages", "services"]
omit = ["*/tests/*", "*/__pycache__/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
fail_under = 60
