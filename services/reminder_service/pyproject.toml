[project]
name = "reminder-service"
version = "0.0.1"
description = "老友 Reminder 服务（PRD §8.1）—— 提醒 CRUD + 应答 + 推送"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "elder-common",
]

[tool.uv.sources]
elder-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
