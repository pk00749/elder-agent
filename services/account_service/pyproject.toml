[project]
name = "account-service"
version = "0.0.1"
description = "老友 Account 服务（PRD §8.1）—— 鉴权 / 绑定 / 日志查询"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "elder-common",
]

[tool.uv.sources]
elder-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
